version: "3.9"

services:
  api:
    build:
      context: .                    # solution root
      dockerfile: FunWordle.API/Dockerfile
    ports:
      - "7216:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

  web:
    build:
      context: ./FunWordle.Web/funwordle-next
      dockerfile: Dockerfile
    container_name: wordle-web
    ports:
      - "3000:3000"   
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://api:8080
      - NODE_ENV=production
    depends_on:
      - api
 
